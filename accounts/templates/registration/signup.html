<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | SkillSwap</title>
</head>
<body>
  <h1>Create your SkillSwap account</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>

  <p><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
</body>
</html>
