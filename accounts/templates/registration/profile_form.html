<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My profile | SkillSwap</title>
</head>

<body>
    <header>
        <a href="{% url 'offers:list' %}">← Browse offers</a>
    </header>

    <main>
        <h1>My profile</h1>

        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save profile</button>
        </form>
    </main>
</body>

</html>
